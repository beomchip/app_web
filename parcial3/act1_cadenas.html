<!DOCTYPE html>

<body>
    <h2>Actividad con Cadenas</h2>

    <button onclick="myFunction()">Boton</button>
    <p id="demo"></p>

    <script>
        function myFunction() {
        let texto = prompt("Ingresa un texto", "ola");
        if (texto != null) {
            document.getElementById("demo").innerHTML =
            "Hola jeje";
            let palabras = texto.split(" ");
            for (let i = 0; i < palabras.length; i++) {
                palabras[i] = palabras[i].charAt(0).toUpperCase() + palabras[i].substring(1, palabras.length + 1);
            }
            alert(palabras + " ")
        }
        }
    </script>
