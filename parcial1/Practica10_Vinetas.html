<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pagina 10</title>
    <link href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Cantarell", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>
<body style="background-color: #e2deff;">
    <h2>The list-style-type Property</h2>
    <p>Este es un ejemplo de lista no ordenada:</p>
    <ul style="list-style-type: circle;">
        <li style="color:#93ace4"><span style="color: black;">Café</span></li>
        <li style="color:#93ace4"><span style="color: black;">Té</span></li>
        <li style="color:#93ace4"><span style="color: black;">Coca Cola</span></li>
    </ul>
    <ul style="list-style-type: disc;">
        <li style="color:#8d83b3"><span style="color: black;">Pozole</span></li>
        <li style="color:#8d83b3"><span style="color: black;">Tamal</span></li>
        <li style="color:#8d83b3"><span style="color: black;">Quesadilla</span></li>
    </ul>
    <ul style="list-style-type: square;">
        <li style="color:#d9a3bf"><span style="color: black;">Azul</span></li>
        <li style="color:#d9a3bf"><span style="color: black;">Lila</li>
        <li style="color:#d9a3bf"><span style="color: black;">Rosa</li>
    </ul>
    <footer>Muñoz Morales Sofía de Jesús - 188168</footer>
</body>
</html>
