<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pagina 10</title>
</head>
<body>
    <h2>The list-style-type Property</h2>
    <p>Example of unordered lists:</p>
    <ul style="list-style-type: circle;">
        <li style="color:#a4d1e0"><span style="color: black;">Coffee</span></li>
        <li style="color:#a4d1e0"><span style="color: black;">Tea</li>
        <li style="color:#a4d1e0"><span style="color: black;">Coca Cola</li>
    </ul>
    <ul style="list-style-type: disc;">
        <li style="color:#afa3d9"><span style="color: black;">Coffee</span></li>
        <li style="color:#afa3d9"><span style="color: black;">Tea</li>
        <li style="color:#afa3d9"><span style="color: black;">Coca Cola</li>
    </ul>
    <ul style="list-style-type: square;">
        <li style="color:#d9a3bf"><span style="color: black;">Coffee</span></li>
        <li style="color:#d9a3bf"><span style="color: black;">Tea</li>
        <li style="color:#d9a3bf"><span style="color: black;">Coca Cola</li>
    </ul>
    <footer>Muñoz Morales Sofía de Jesús - 188168</footer>
</body>
</html>
