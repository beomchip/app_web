<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Animación</title>
  <link rel="stylesheet" href="css/estiloTd.css">
  <link rel="icon" type="image/x-icon" href="asset/bamgeuticonjej.png">
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: rgb(218, 164, 189);
  position: relative;
  animation-name: myAnimation;
  animation-duration: 4s;
  animation-delay: 1s;
  animation-iteration-count: infinite;
}

@keyframes myAnimation {
  0%   {background-color:rgb(145, 141, 201); left:0px; top:0px;}
  20%  {background-color:rgb(99, 92, 207); left:200px; top:0px;}
  40%  {background-color:rgb(240, 153, 153); left:300px; top:30px;}
  60%  {background-color:rgb(166, 152, 248); left:500px; top:300px;}
  80% {background-color:rgb(115, 134, 173); left:50px; top:0px;}
  100% {background-color:rgb(115, 134, 173); left:0px; top:0px;}
}
</style>
</head>
<body>
    <h1>CSS animation-delay Property</h1>
    <p>The animation-delay property specifies a delay for the start of an animation. The following example has a 1 second delay before starting the animation:</p>
    <div></div>
