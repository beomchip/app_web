<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <title>Tabla Préstamos</title>
    <style>
        .tabla {
            border: 1px solid rgb(46, 46, 78);           
            margin: 0 auto; 
        }
        th, td {
            border: 1px solid black;            
            text-align: center;
            width: 100px;

        }
         #btnConsultar {
            background-color: #7b71a1;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .contenedor {
            height: 100vh;
            text-align: center;
        }
         img {
            width: 100px;
            
        }
    </style>
</head>
<body>
    <div class = "contenedor">
        <button id = "btnConsultar" onclick = "genTabla()">Consultar Préstamos</button>
        <div id="tabla_dinamica">
            <table class="tabla">
                <tr>
                    <td>Cien años de soledad</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>El Principito</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>Don Quijote</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>Harry Potter</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>La Odisea</td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </div>
    </div>
        <script>
            function genTabla(){
                let total = [0, 0, 0, 0, 0];
                let prestados = [0, 0, 0, 0, 0];
                let porcentajes = [0, 0, 0, 0, 0];
                let i = 0, j = 0, num = 0, cont = 0;
                for(i = 0; i < 5; i++){
                    total[i] = Math.floor(Math.random()*51);
                    prestados[i] = Math.floor(Math.random()*total[i]);
                    porcentajes[i] = (prestados[i] * 100)/total[i];
                }

                let html_txt = "<table class = 'tabla'>";
                for(j = 0; j < 5; j++){
                    html_txt += "<tr>";
                        for(j = 0; j < 3; j++){
                            html_txt += "<td>";
                            html_txt += "</td>";
                            html_txt += "<td>";
                            html_txt += "<img class = 'barrita' src = 'img/Barrita.png'>";
                            html_txt += "</td>";
                            html_txt += "<td>";
                            html_txt += ""+ porcentajes + "%";
                            html_txt += "</td>";
                        }
                    html_txt += "</tr>";
                }
                html_txt += "</table>";
                document.getElementById("tabla_dinamica").innerHTML = html_txt;
                //perdón :c
            }
        </script>
    <footer style = "text-align: center;">
        Sofía de Jesús Muñoz Morales - 188168
    </footer>
</body>
</html>
