<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="css/estiloTd.css">
    <link rel="icon" type="image/x-icon" href="asset/bamgeuticonjej.png">
  </head>
<style>

div.panel{
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
}

div.bg-image{
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url(asset/lilac.gif);
  filter: blur(8px);
  z-index: 1;
  background-size: cover;
  background-position: center;
  transform: scale(1.1);
}

div.front{
  position: relative;
  width: 100%;
  padding: 20px;
  z-index: 2;
  box-sizing: border-box;
}

form {
  border-radius: 5px; 
  padding: 50px;
 
}

label {display: block;}

input[type=text], input[type=tel], select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}
input[type=text]:focus, input[type=tel]:focus {
  background-color: rgb(236, 183, 201);
}

input[type=submit] {
  width: 100%;
  background-color: rgb(231, 183, 195);
  color: white;
  padding: 14px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: rgb(187, 136, 155);
}
</style>
<body>

<h1>Style an HTML Form with CSS</h1>


<div class="panel">
  <div class="bg-image"></div>
  <div class="front">
<form action="index.html">
  <label for="fname">Nombre</label>
  <input type="text" id="fname" name="firstname" placeholder="Your name...">

  <label for="lname">Apellido</label>
  <input type="text" id="lname" name="lastname" placeholder="Your last name...">

  <label for="country">Pais</label>
  <select id="country" name="country">
    <option value="australia">Australia</option>
    <option value="canada">Canada</option>
    <option value="usa">USA</option>
    <option value="mex">Mexico</option>
  </select>

  <label for="carrera">Carrera</label>
  <select name="carrera" id="carrera">
    <option value="itiid">ITIID</option>
    <option value="isti">ISTI</option>
    <option value="itma">ITMA</option>
    <option value="lag">LAG</option>
    <option value="lmi">LMI</option>
  </select>

  <label for="telf">Teléfono</label>
  <input type="tel" name="phonenumber" placeholder="Número celular">
  
  <input type="submit" value="Submit">
</form>
</div>
</div>
<footer style="text-align: center;">
    </br>
        Sofía de Jesús Muñoz Morales - 188168
    </footer>
</body>
</html>
