<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/estiloTd.css">
    <title>DoWhile</title>
    <script>
        var text="";
        var i=0;
        do {
        text += "The number is " + i + "\n";
        i++;
        }
        while (i < 10);
        alert(text);
    </script>
</head>
<body>
    <h2>Ejemplo Do-While</h2>
    <footer>Sofía de Jesús Muñoz Morales - 188168</footer>
</body>
</html>
