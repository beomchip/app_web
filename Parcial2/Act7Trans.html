<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/estiloTd.css">
<style> 
div {
  width: 50px;
  height: 50px;
  background-color: rgb(207, 165, 204);
  transition: width 2s, height 2s, background-color 2s, transform 2s;
}

div:hover {
  width: 450px;
  height: 500px;
  background-color: rgb(139, 129, 175);  
  transform: rotate(720deg);
}
</style>
</head>
<body>
    <h1>Transición y Transformación</h1>
    <p>Coloca el cursor sobre el elemento div que aparece a continuación:</p>
    <div></div>

</body>
</html>
