<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/estiloTd.css">
    <title>While</title>
    <script>
       var text="";
        var i=0;
        while (i < 10) {
        text += "The number is " + i + "\n";
        i++;
        }
        alert(text);
    </script>
</head>
<body>
    <h2>Ejemplo While</h2>
