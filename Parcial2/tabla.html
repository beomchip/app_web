<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    
    <title>Tabla Aleatoria</title>
    <link rel="icon" type="image/x-icon" href="asset/bamgeuticonjej.png">
    <link rel="stylesheet" type="text/css" href="css/estiloGen.css" media="screen" />
    <style>
        .tabla {
            border: 1px solid blue;           
            margin: 0 auto; 
        }
        th, td {
            border: 1px solid black;            
            text-align: center;
            width: 100px;
            height: 100px;

        }
         #btnAlerta {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .contenedor {
            text-align: center;
        }
         img {
            width: 100px;
            
        }
                
    </style>    
</head>
<body>
    <h2>Tabla con Imágenes Aleatorias</h2>
    <div class="contenedor">
        <button id="btnAlerta" onclick=" generarTablaImagenes()">Haz clic aqui</button>
        <div id="tabla_dinamica">
            <table class="tabla">
                <tr>
                    <td>a</td>
                    <td>d</td>
                    <td>x</td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
        </div>
    </div>
    <footer style="text-align:center;">
    </br>
        Sofía de Jesús Muñoz Morales - 188168
    </footer>
    <script>
       function generarTablaImagenes() {
        let numeros = [1, 2, 3, 4, 5, 6, 7, 8, 9];
        let check = [0, 0, 0, 0, 0, 0, 0, 0, 0];
        let num = 0, cont = 0, i = 0, j = 0;
        for (i = 0; i < 9; i++) {
            do{
                num = Math.floor(Math.random()*9); //del 0 al 8
            }while(check[num] == 1); //cuando ya fue asignado a 1
            check[num] = 1;
            numeros[i] = num+1;
        }
        let html_txt = "<table class = 'tabla'>";
        for(i = 0, cont = 0; i < 3; i++){
            html_txt += "<tr>";
            for(j = 0; j < 3; j++, cont++){
                html_txt += "<td>";
                html_txt += "<img src = 'img/"+numeros[cont]+".jpg'>";
                html_txt += "</td>";
            }
            html_txt += "</tr>";
        }
        html_txt += "</table>";
        document.getElementById("tabla_dinamica").innerHTML = html_txt;
       }
    </script>
</body>
</html>
