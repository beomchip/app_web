        <script>
        function generarTablas() {
            let i = 0, j = 0;
            let calificacion = 0;
            let claseFila = "";

            let html1 = "<table>";
            html1 += "<tr><th>Nombre</th><th>Calificacion1</th><th>Calificacion2</th><th>Calificacion3</th></tr>";

            for (i = 1; i <= 5; i++) {
                if (i % 2 == 0) {
                    claseFila = "filaClara";
                } else {
                    claseFila = "filaOscura";
                }

                html1 += "<tr class='" + claseFila + "'>";
                html1 += "<td>alumno " + i + "</td>";

                for (j = 0; j < 3; j++) {
                    calificacion = (Math.random() * 10).toFixed(1);
                    html1 += "<td>" + calificacion + "</td>";
                }

                html1 += "</tr>";
            }
            html1 += "</table>";
            document.getElementById("tabla_dinamica").innerHTML = html1;

            let html2 = "<table>";
            html2 += "<tr><th>Nombre</th><th>Calificacion1</th><th>Calificacion2</th><th>Calificacion3</th><th>Promedio</th></tr>";

            for (i = 1; i <= 5; i++) {
                if (i % 2 == 0) {
                    claseFila = "filaClara";
                } else {
                    claseFila = "filaOscura";
                }

                html2 += "<tr class='" + claseFila + "'>";
                html2 += "<td>alumno " + i + "</td>";

                let suma = 0;
                for (j = 0; j < 3; j++) {
                    calificacion = Math.floor(Math.random() * 11);
                    suma += calificacion;
                    html2 += "<td>" + calificacion + "</td>";
                }

                let promedio = (suma / 3);
                html2 += "<td>" + promedio + "</td>";
                html2 += "</tr>";
            }
            html2 += "</table>";
            document.getElementById("tabla_dinamica2").innerHTML = html2;
        }
    </script>
