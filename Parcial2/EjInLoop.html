<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/estiloTd.css">
    <title>ForEach</title>
    <script>
       var txt = "";
        var dias =
        ["LUNES"," MARTES"," MIERCOLES"," JUEVES"," VIERNES"," SABADO"," DOMINGO"];
        alert(dias);
        var x;
        for (x in dias) {
        txt += dias[x] + "\n";
        }
        alert(txt);
    </script>
</head>
<body>
    <h2>Ejemplo ForEach</h2>

</body>
